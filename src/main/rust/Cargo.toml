# SmartRAG v2 - Rust Vector Engine
# Version: 2.0.0
# Date: 2025-10-26
# Author: YAKKI SMART Team

[package]
name = "smartrag-vector"
version = "2.0.0"
edition = "2021"

[lib]
name = "smartrag_vector"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
hora = "0.1"
lazy_static = "1.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
